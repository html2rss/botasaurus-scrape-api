[project]
name = "botasaurus-scrape-api"
version = "2.0.0"
description = "Docker-first FastAPI wrapper around Botasaurus for rendered HTML scraping"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic-settings==2.13.1",
    "sentry-sdk==2.68.0",
    "botasaurus @ git+https://github.com/omkarcloud/botasaurus.git@7936afad5f8ca78fe0581a9dabd5f7d6964c6b1a",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
    "PyYAML==6.0.3",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "SIM105",
]
